# ==============================================================================
# go-librespot configuration template for SteamOS / Steam Deck
# Installed to: ~/.config/go-librespot/config.yml
# ==============================================================================

# Device identity advertised on Spotify Connect
device_name: "Steam Deck Jam"
device_type: "speaker"

# Audio backend: pulseaudio routes directly through PipeWire-Pulse on SteamOS.
# This works seamlessly in both Gaming Mode and Desktop Mode without taking exclusive
# ALSA hardware locks away from Steam games or gamescope!
audio_backend: "pulseaudio"

# Zeroconf / Spotify Connect discovery
zeroconf_enabled: false

# Firewall friendly ports (443/80 before 4070) for mobile hotspot NATs and event firewalls
prefer_firewall_friendly_ports: true

# Disable autoplay so go-librespot cleanly emits stopped/not_playing at track end
disable_autoplay: true

# Credentials configuration: device_auth for frictionless 1-tap phone hotspot pairing
credentials:
  type: "device_auth"

# Local encrypted audio cache
# Crucial for road trips, camping, and shaky Wi-Fi / cell hotspot connections.
# go-librespot caches encrypted CDN audio chunks locally up to 2GB with LRU eviction,
# eliminating buffering and stuttering when replay occurs.
cache:
  enabled: true
  dir: ""
  size_limit: "2GB"

# Local HTTP management API for DeckJam backend control
server:
  enabled: true
  address: "127.0.0.1"
  port: 3678

# Volume and normalization settings
volume_steps: 100
initial_volume: 80
normalisation_enabled: true
