<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Queueing to DeckJam...</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#181b1f">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111315;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .redirect-card {
      background: #181b1f;
      border: 1px solid #2b313a;
      border-radius: 14px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #22262c;
      border-top-color: #1ed760;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .heading {
      font-size: 16px;
      font-weight: 700;
    }
    .desc {
      font-size: 13px;
      color: #9aa1ac;
    }
    .btn-manual {
      display: none;
      background: #1ed760;
      color: #0d0f11;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="spinner" id="spinner"></div>
    <div class="heading">Sending to Steam Deck...</div>
    <div class="desc" id="statusText">Forwarding your Spotify link to the party queue.</div>
    <a href="#" id="btnManual" class="btn-manual">Tap to Open DeckJam</a>
  </div>

  <script>
    (function () {
      const STORAGE_SERVER = 'deckjam_shim_server';
      const STORAGE_GUEST = 'deckjam_shim_guest';
      const STORAGE_NAME = 'deckjam_shim_name';

      const statusText = document.getElementById('statusText');
      const btnManual = document.getElementById('btnManual');

      // 1. Parse incoming parameters passed by Android OS Share Target
      const params = new URLSearchParams(window.location.search);
      const sharedUrl = params.get('url') || '';
      const sharedText = params.get('text') || '';
      const sharedTitle = params.get('title') || '';

      // Combine text to ensure Spotify track link is caught
      const fullText = [sharedTitle, sharedText, sharedUrl].filter(Boolean).join(' ');

      // 2. Retrieve destination server & guest identity from localStorage
      const server = (localStorage.getItem(STORAGE_SERVER) || 'http://steamdeck.local:8080').replace(/\/+$/, '');
      const guestId = localStorage.getItem(STORAGE_GUEST) || '';
      const guestName = localStorage.getItem(STORAGE_NAME) || 'Shared Guest';

      // 3. Construct target URL on the local Steam Deck server (/share)
      const redirectTarget = `${server}/share?text=${encodeURIComponent(fullText)}&guest=${encodeURIComponent(guestId)}&guest_name=${encodeURIComponent(guestName)}`;

      // Setup manual fallback link in case browser blocks immediate redirect
      btnManual.href = redirectTarget;

      // 4. Perform immediate top-level redirection
      try {
        window.location.replace(redirectTarget);
      } catch (e) {
        window.location.href = redirectTarget;
      }

      // Show manual fallback button after 800ms if still on page
      setTimeout(() => {
        btnManual.style.display = 'inline-block';
        statusText.textContent = 'If not redirected automatically, tap the button below:';
      }, 800);
    })();
  </script>
</body>
</html>
